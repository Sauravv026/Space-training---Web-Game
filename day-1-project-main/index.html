<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junior Astronaut Mission Trainer</title>
</head>
<body>

    <h1>Junior Astronaut Mission Trainer</h1>
    <p>Train like a real astronaut!</p>

    <!-- B. Dynamic astronaut information (filled in by script.js) -->
    <p><strong>Astronaut:</strong> <span id="astronaut-name"></span></p>
    <p><strong>Mission:</strong> <span id="mission-name"></span></p>
    <p><strong>Destination:</strong> <span id="destination"></span></p>

    <img src="astronaut.jpg" alt="Astronaut Image" width="200">

    <!-- A. Mission status -->
    <p><strong>Mission Status:</strong> <span id="mission-status">Not Started</span></p>

    <!-- C. Resources (filled in by script.js) -->
    <h3>Resources</h3>
    <p>Oxygen: <span id="oxygen"></span></p>
    <p>Water: <span id="water"></span></p>
    <p>Food: <span id="food"></span></p>
    <p>Power: <span id="power"></span></p>

    <!-- A and D. Buttons -->
    <button type="button" id="start-btn">START MISSION</button>
    <button type="button" id="check-btn">CHECK MISSION</button>

    <!-- D. Message shown after Check Mission is clicked -->
    <p id="check-message"></p>

    <script src="script.js"></script>
</body>
</html>
